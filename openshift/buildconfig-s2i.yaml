apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: learn-quarkus-03-s2i
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jamie-burns0/learn-quarkus-03.git
      ref: main
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: java:openjdk-21-ubi9
  output:
    to:
      kind: ImageStreamTag
      name: learn-quarkus-03:s2i
  triggers:
    - type: ConfigChange
