apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: learn-quarkus-03
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: learn-quarkus-03
spec:
  source:
    type: Git
    git:
      uri: git@github.com:jamie-burns0/learn-quarkus-03.git
      ref: main
    sourceSecret:
      name: github-ssh
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/openjdk-21
  output:
    to:
      kind: ImageStreamTag
      name: learn-quarkus-03:s2i
  triggers:
    - type: ConfigChange
