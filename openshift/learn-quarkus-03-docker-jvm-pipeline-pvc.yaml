kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: learn-quarkus-03-docker-jvm-pipeline-pvc
  namespace: jamie-burns0-dev
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp3
  volumeMode: Filesystem
