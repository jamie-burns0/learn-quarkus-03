apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: learn-quarkus-03-docker-jvm
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jamie-burns0/learn-quarkus-03.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: openshift/Dockerfile.jvm
  output:
    to:
      kind: ImageStreamTag
      name: learn-quarkus-03:jvm
  triggers:
    - type: ConfigChange
