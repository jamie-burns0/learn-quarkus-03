apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: learn-quarkus-03
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: learn-quarkus-03-docker-jvm
spec:
  source:
    type: Git
    git:
      uri: git@github.com:jamie-burns0/learn-quarkus-03.git
      ref: main
    sourceSecret:
      name: github-ssh
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: openshift/Dockerfile.jvm
  output:
    to:
      kind: ImageStreamTag
      name: learn-quarkus-03:docker-jvm
  triggers:
    - type: ConfigChange
