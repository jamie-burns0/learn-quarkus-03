apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: learn-quarkus-03-docker-jvm
  namespace: jamie-burns0-dev
spec:
  workspaces:
  - name: workspace
  params:
  - name: git-url
    type: string
    description: git url of our project
    default: https://github.com/jamie-burns0/learn-quarkus-03.git
  - name: git-revision
    type: string
    description: git revision
    default: main
  - name: image
    type: string
    description: name of our image
    default: default-route-openshift-image-registry.apps.rm2.thpm.p1.openshiftapps.com/jamie-burns0-dev/learn-quarkus-03-docker-jvm:latest
  - name: dockerfile
    type: string
    description: path to our dockerfile
    default: openshift/Dockerfile.jvm
  tasks:

  - name: fetch
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: git-clone
      - name: namespace
        value: openshift-pipelines
    workspaces:
    - name: output
      workspace: workspace
    # runAfter:
    # - ...  
    params:
    - name: DELETE_EXISTING
      value: "true"
    - name: VERBOSE
      value: "false"
    - name: SSL_VERIFY
      value: "true"
    - name: URL
      value: $(params.git-url)
    - name: REVISION
      value: $(params.git-revision)
  
  - name: build
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: buildah
      - name: namespace
        value: openshift-pipelines
    workspaces:
    - name: source
      workspace: workspace
    runAfter:
    - fetch
    params:
    - name: IMAGE
      value: $(params.image)
    - name: DOCKERFILE
      value: $(params.dockerfile)

  - name: deploy
    taskRef:
      resolver: cluster
      params:
      - name: name
        value: openshift-client
      - name: kind
        value: task
      - name: namespace
        value: openshift-pipelines
    runAfter:
    - build
    params:
    - name: SCRIPT
      value: |
        oc create deployment learn-quarkus-03-docker-jvm --image=$(tasks.build.results.IMAGE_URL)@$(tasks.build.results.IMAGE_DIGEST) --dry-run=client -o yaml | oc apply -f -
        oc rollout status deploy/learn-quarkus-03-docker-jvm
        oc create service clusterip learn-quarkus-03-docker-jvm --tcp=8080:8080,8443:8443 --dry-run=client -o yaml | oc apply -f -
        oc expose svc learn-quarkus-03-docker-jvm --dry-run=client -o yaml | oc apply -f -
        oc create route edge learn-quarkus-03-docker-jvm-secure --service=learn-quarkus-03-docker-jvm --dry-run=client -o yaml | oc apply -f -
    
    